<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data: vscode-resource:; style-src 'unsafe-inline' vscode-resource:; script-src 'unsafe-eval' 'unsafe-inline' vscode-resource:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Webview-provided resources -->
    <link rel="stylesheet" href="{{STYLE_URI}}">

    <!-- Embed Copilot-like font (served via webview.asWebviewUri) -->
    <style>
      @font-face {
        font-family: 'CopilotUI';
        src: url('{{FONT_URI}}');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      :root { font-family: 'CopilotUI', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="toolbar">
        <div class="title"><img src="{{LOGO_URI}}" class="logo" alt="logo"/><span>EnoHacker</span></div>
        <div class="actions">
          <button id="clearBtn" class="icon" title="Clear"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 6h18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 6v12a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M14 11v6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
          <button id="abortBtn" class="icon" title="Abort"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M18 6L6 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 6l12 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button id="exportBtn" class="icon" title="Export conversation"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 5v14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 12l7-7 7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button id="terminalModeBtn" title="Terminal mode" class="icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 9l3 3-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 6v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> 终端模式</button>
        </div>
      </div>

      <div id="output" role="log" aria-live="polite"></div>

      <!-- hidden avatar source for messages -->
      <img id="avatarSrc" src="{{AVATAR_URI}}" style="display:none" alt="avatar-source" />

      <div id="inputArea">
        <textarea id="prompt" placeholder="Ask EnoHacker... (Ctrl/Cmd+Enter to send)"></textarea>
        <button id="sendBtn">Send</button>
      </div>
    </div>
    <link rel="stylesheet" href="{{HLJS_CSS_LIGHT_URI}}" media="(prefers-color-scheme: light)">
    <link rel="stylesheet" href="{{HLJS_CSS_DARK_URI}}" media="(prefers-color-scheme: dark)">

    <script src="{{MARKED_URI}}"></script>
    <script src="{{HLJS_CORE_URI}}"></script>
    <script src="{{HLJS_JS_URI}}"></script>
    <script src="{{HLJS_TS_URI}}"></script>
    <script src="{{HLJS_PY_URI}}"></script>
    <script src="{{HLJS_BASH_URI}}"></script>
    <script src="{{HLJS_JSON_URI}}"></script>
    <script src="{{HLJS_XML_URI}}"></script>

    <script src="{{SCRIPT_URI}}"></script>
  </body>
</html>
